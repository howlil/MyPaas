services:
  appsmith:
    image: appsmith/appsmith-ce:release
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      APPSMITH_ENCRYPTION_PASSWORD: compatibility-only-password-change-me
      APPSMITH_ENCRYPTION_SALT: compatibility-only-salt-change-me
    volumes:
      - appsmith-stacks:/appsmith-stacks

volumes:
  appsmith-stacks:
