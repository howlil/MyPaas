services:
  meilisearch:
    image: getmeili/meilisearch:v1.37
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: compatibility-only-master-key-please-replace
    volumes:
      - meili-data:/meili_data

volumes:
  meili-data:
