name: Run detection-first port patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'contrib/auto-detect-app-port' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: contrib/auto-detect-app-port
      - name: Execute embedded patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-auto-port-patch.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("          PY\n      - name: Commit patch", start)
          script = dedent(workflow[start:end])
          exec(compile(script, 'apply-auto-port-patch', 'exec'))
          PY
      - name: Commit patched UX
        shell: bash
        run: |
          rm .github/workflows/apply-auto-port-patch.yml .github/workflows/kick-auto-port-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/routes/projects/new/+page.svelte .github/workflows/apply-auto-port-patch.yml .github/workflows/kick-auto-port-patch.yml
          git commit -m "refactor: make app port detection-first [port-patch-done]"
          git push origin HEAD:contrib/auto-detect-app-port
